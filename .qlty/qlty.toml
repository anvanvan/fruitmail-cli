# .qlty/qlty.toml -- generated by bin/qlty-baseline derive (baseline v1-dbd2e2c3).
# Edit only the project section; re-run `bin/qlty-baseline derive <path> --apply` after a baseline change.
# Read by qlty CLI and Qlty Cloud alike. Reference: https://qlty.sh/d/qlty-toml
config_version = "0"

# qlty-baseline stamp=v1-dbd2e2c3 -- generated by bin/qlty-baseline render; do not edit between the baseline markers
exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/testdata/**",
  "**/vendor/**",
  ".claude/cycles/**",
]

test_patterns = [
  "**/test/**",
  "**/tests/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

# autofix set (save, commit, ship pass it as --filter): ruff eslint shellcheck golangci-lint clippy rubocop swiftlint sqlfluff dotenv-linter -- never: knip

[smells]
mode = "comment"

[smells.boolean_logic]
threshold = 5

[smells.nested_control_flow]
threshold = 5

[smells.function_parameters]
threshold = 5

[smells.return_statements]
threshold = 6

[smells.file_complexity]
threshold = 50

[smells.function_complexity]
threshold = 15

[smells.identical_code]
threshold = 12

[smells.similar_code]
threshold = 12

[[source]]
name = "default"
default = true

# generic test triage: only bandit:B101, never [[exclude]] (a sibling rule keeps firing in tests)
[[triage]]
match.plugins = ["bandit"]
match.rules = ["B101"]
match.file_patterns = ["**/tests/**", "**/test_*.py", "**/*_test.py"]
set.ignored = true

# bandit low: its documented severity per rule (qlty reports every bandit rule as high)
[[triage]]
match.plugins = ["bandit"]
match.rules = [
  "B101",
  "B105",
  "B106",
  "B107",
  "B110",
  "B112",
  "B311",
  "B403",
  "B404",
  "B405",
  "B406",
  "B407",
  "B408",
  "B409",
  "B504",
  "B603",
  "B606",
  "B607",
]
set.level = "low"
set.mode = "comment"

# bandit medium: its documented severity per rule (qlty reports every bandit rule as high)
[[triage]]
match.plugins = ["bandit"]
match.rules = [
  "B102",
  "B104",
  "B108",
  "B113",
  "B301",
  "B302",
  "B303",
  "B305",
  "B306",
  "B307",
  "B308",
  "B310",
  "B313",
  "B314",
  "B315",
  "B316",
  "B317",
  "B318",
  "B319",
  "B323",
  "B503",
  "B506",
  "B508",
  "B509",
  "B601",
  "B604",
  "B608",
  "B610",
  "B611",
  "B612",
  "B614",
  "B615",
  "B702",
  "B703",
  "B704",
]
set.level = "medium"
set.mode = "comment"

# always on: semgrep (rules: .qlty/configs/.semgrep.yaml)
[[plugin]]
name = "semgrep"
extra_packages = ["pydantic@2.13.5"]

# semgrep is a security scanner qlty files as lint: its lint driver reports vulnerability, so it blocks at high
[plugins.definitions.semgrep.drivers.lint]
output_category = "vulnerability"

# lint-slop only (the TODO/NOTE driver is gone), comment mode
[[plugin]]
name = "ripgrep"
drivers = ["lint-slop"]
mode = "comment"

[plugins.definitions.ripgrep.drivers.lint-slop]
script = '''sh -c 'for f in ${target}; do case "$f" in test/*|*/test/*|tests/*|*/tests/*|spec/*|*/spec/*|specs/*|*/specs/*|__tests__/*|*/__tests__/*|__mocks__/*|*/__mocks__/*|fixtures/*|*/fixtures/*|fixture/*|*/fixture/*|mocks/*|*/mocks/*|*.test.*|*.spec.*|*_test.*|*_spec.*|test_*|*/test_*|spec_*|*/spec_*|.claude/cycles/*|*/.claude/cycles/*|_archive/*|*/_archive/*) continue;; esac; rg -f .qlty/configs/slop-patterns.txt "$f" --json; done; exit 0' '''
output = "stdout"
output_format = "ripgrep"
output_missing = "parse"
driver_type = "linter"
batch = true
max_batch = 64
success_codes = [0, 1]
config_files = [".qlty/configs/slop-patterns.txt"]
# qlty-baseline end of head

# qlty-baseline project section -- hand edits welcome between here and the tail marker

# derive: actionlint -- github-workflow (>= 1 file)
[[plugin]]
name = "actionlint"

# derive: bandit -- python (>= 1000 lines)
[[plugin]]
name = "bandit"

# derive: eslint -- typescript (main language)
[[plugin]]
name = "eslint"

# derive: knip -- typescript (main language)
[[plugin]]
name = "knip"

# derive: mypy -- python (>= 1000 lines)
[[plugin]]
name = "mypy"

# derive: osv-scanner -- lockfile (>= 1 file)
[[plugin]]
name = "osv-scanner"

# derive: ruff -- python (>= 1000 lines)
[[plugin]]
name = "ruff"

# derive: shellcheck -- shell (>= 1 file)
[[plugin]]
name = "shellcheck"

# derive: zizmor -- github-workflow (>= 1 file)
[[plugin]]
name = "zizmor"

# derive: shellcheck scope pin -- shell, shell_scripts
[plugins.definitions.shellcheck]
file_types = ["shell", "shell_scripts"]

# derive: extensionless shell code found by shebang
[file_types.shell_scripts]
globs = [
  "fruitmail",
  "scripts/committer",
  "scripts/release",
  "scripts/releases",
]
# qlty-baseline end of project section

# qlty-baseline stamp=v1-dbd2e2c3 tail -- block modes by category; keep LAST

# qlty applies EVERY matching [[triage]] in file order (later sets win); the category rules below
# are disjoint, rule-category rules (security rules of a lint plugin) follow them and win for the
# rules they name, and nothing after the tail may re-set a mode. [[triage]] cannot match a
# category, so it is written per plugin (baseline.json block.plugin_categories, rule_categories).
# below high every issue is comment
[[triage]]
match.levels = ["note", "fmt", "low", "medium"]
set.mode = "comment"

# high, but qlty files these plugins' issues under no block category (lint, style, ...) -> comment
[[triage]]
match.plugins = ["actionlint", "eslint", "knip", "mypy", "ripgrep", "ruff", "shellcheck"]
match.levels = ["high"]
set.mode = "comment"

# high and a block category (vulnerability, security_hotspot, bug, dependency_alert) -> block
[[triage]]
match.plugins = ["bandit", "osv-scanner", "semgrep", "zizmor"]
match.levels = ["high"]
set.mode = "block"
# qlty-baseline end of tail
